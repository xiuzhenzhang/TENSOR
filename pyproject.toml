[project]
name = "tpp-playground"
version = "1.0.0"
description = "Main coderepo of MTPP models."
readme = "README.md"
requires-python = "==3.13.*"

[dependency-groups]
base = [
    "torch",
    "torchvision",
    "torchaudio",
    "pandas==2.3.3",
    "numpy",
    "einops",
    "scipy",
    "scikit-learn",
    "tqdm",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "termcolor",
    "transformers[torch]",
    "accelerate",
    "tabulate",
    "datasets",
    "submitit",
    "ipykernel",
    "ipywidgets",
    "nvidia-cudnn-cu13",
    "mistral-common"
]

llm = [
    "openai",
    "vllm",
    "sglang[all]==0.5.9",
    "sgl-kernel",
    "flashinfer-python",
]

# Settings for uv
[tool.uv]
# Something we need during development while not when release.
default-groups = ["base", "optional", "llm"]
prerelease = "allow"
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Install pytorch from the official pytorch repo.
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
vllm = { git = "https://github.com/vllm-project/vllm", tag = "v0.15.0"}
sgl-kernel = { index = "sglang-wheels" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "sglang-wheels"
url = "https://docs.sglang.ai/whl/cu130"
explicit = true

# ruff settings.
[tool.ruff]
line-length = 120

# https://www.reddit.com/r/Python/comments/1kttfst/ruff_users_what_rules_are_using_and_what_are_you/
[tool.ruff.lint]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "COM",      # enforce trailing comma rules
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
]

ignore = [
    "COM812",   # mentioned by ruff.
    "SIM115",   # allow use of open() or Path.open() without a context.
    "FBT001",   # allow a function parameter being boolean.
    "FBT002",   # allow the default of a function parameter being boolean.
    "S603",     # We need subprocess.Popen().
    "N812",     # So ruff is not angry for calling torch.nn.functional as F.
    "E501",
    "E402"
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
